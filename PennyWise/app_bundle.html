<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PennyWise — Student Allowance & Expense Management System</title>
  <style>
/**
 * style.css
 * Production Stylesheet for PennyWise — Student Allowance & Expense Management System
 * 
 * Includes:
 * 1. Authentication Pages (Login & Register split-screen layout)
 * 2. Application Shell (Left Sidebar Navigation Menu + Sticky Top Bar + Responsive Mobile Drawer)
 * 3. Page 1: Financial Dashboard (4 Summary Cards, Category Progress Bars, Recent Activity Feed)
 * 4. Page 2 & 3: Allowance Manager & Expense Tracker (Summary Banners, Forms, Dedicated Tables)
 * 5. Page 4: Transaction History (Filter/Sort/Search Toolbar, Subtotal Bar, CSV Export)
 * 6. Page 5: Student Profile & Settings (Student ID Card, Avatar Swatches, Profile Editor)
 * 7. Modals, Toasts & Responsive Media Queries
 */

/* ==========================================================================
   1. CSS Variables & Reset
   ========================================================================== */
:root {
  --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  --color-primary: #0f172a;
  --color-primary-light: #1e293b;
  --color-brand: #2563eb;
  --color-brand-hover: #1d4ed8;
  --color-brand-light: #eff6ff;

  --color-income: #10b981;
  --color-income-hover: #059669;
  --color-income-bg: #ecfdf5;
  --color-income-border: #a7f3d0;

  --color-expense: #ef4444;
  --color-expense-hover: #dc2626;
  --color-expense-bg: #fef2f2;
  --color-expense-border: #fecaca;

  --color-warning: #f59e0b;
  --color-warning-bg: #fffbeb;
  --color-warning-border: #fde68a;

  --color-bg-page: #f1f5f9;
  --color-bg-card: #ffffff;
  --color-bg-subtle: #f8fafc;

  --color-text-main: #0f172a;
  --color-text-muted: #64748b;
  --color-text-light: #94a3b8;
  --color-border: #e2e8f0;

  --sidebar-width: 268px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.12);
  --shadow-xl: 0 20px 30px -8px rgba(15, 23, 42, 0.18);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--color-bg-page);
  color: var(--color-text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.hidden {
  display: none !important;
}

/* ==========================================================================
   2. Authentication Screen (Login & Registration)
   ========================================================================== */
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: stretch;
  background-color: var(--color-primary);
}

.auth-wrapper {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  width: 100%;
  min-height: 100vh;
}

@media (max-width: 920px) {
  .auth-wrapper {
    grid-template-columns: 1fr;
  }
}

.auth-hero {
  background: radial-gradient(circle at top left, #1e3a8a 0%, #0f172a 70%);
  color: #ffffff;
  padding: 3rem 3.5rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

@media (max-width: 920px) {
  .auth-hero {
    padding: 2rem 1.5rem;
  }
}

.auth-hero-brand {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.brand-icon-lg {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
}

.auth-brand-name {
  font-size: 1.65rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.auth-brand-name span {
  color: #60a5fa;
}

.auth-brand-tag {
  font-size: 0.8rem;
  color: #94a3b8;
  display: block;
}

.auth-hero-content {
  max-width: 520px;
  margin: 2.5rem 0;
}

.auth-hero-heading {
  font-size: 2.15rem;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}

.auth-hero-lead {
  font-size: 1rem;
  color: #cbd5e1;
  margin-bottom: 2rem;
}

.auth-feature-list {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.auth-feature-item {
  display: flex;
  align-items: flex-start;
  gap: 0.875rem;
}

.auth-feature-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background-color: rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 0.15rem;
}

.auth-feature-item strong {
  display: block;
  font-size: 0.95rem;
  margin-bottom: 0.15rem;
}

.auth-feature-item p {
  font-size: 0.85rem;
  color: #94a3b8;
}

.auth-hero-footer {
  font-size: 0.8rem;
  color: #64748b;
}

.auth-card-panel {
  background-color: var(--color-bg-page);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1.5rem;
}

.auth-card {
  background-color: #ffffff;
  width: 100%;
  max-width: 480px;
  border-radius: var(--radius-xl);
  padding: 2.25rem;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--color-border);
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background-color: var(--color-bg-page);
  padding: 0.3rem;
  border-radius: var(--radius-md);
  margin-bottom: 1.5rem;
}

.auth-tab {
  background: none;
  border: none;
  padding: 0.65rem;
  font-family: var(--font-main);
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--color-text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
}

.auth-tab.active {
  background-color: #ffffff;
  color: var(--color-primary);
  box-shadow: var(--shadow-sm);
}

.auth-form-header {
  margin-bottom: 1.25rem;
}

.auth-form-header h3 {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--color-primary);
}

.auth-form-header p {
  font-size: 0.875rem;
  color: var(--color-text-muted);
}

.auth-switch-prompt {
  margin-top: 1.25rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--color-text-muted);
}

.link-btn {
  background: none;
  border: none;
  color: var(--color-brand);
  font-weight: 700;
  font-family: var(--font-main);
  cursor: pointer;
  text-decoration: underline;
}

/* ==========================================================================
   3. App Shell: Sidebar Navigation Menu & Topbar
   ========================================================================== */
.app-shell {
  display: flex;
  min-height: 100vh;
}

.app-sidebar {
  width: var(--sidebar-width);
  background-color: var(--color-primary);
  color: #ffffff;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 60;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  transition: transform 0.25s ease;
}

.sidebar-inner {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 1.25rem 1rem;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.25rem 0.5rem 1.25rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  flex-shrink: 0;
}

.sidebar-brand-text {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.sidebar-title {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.sidebar-title span {
  color: #60a5fa;
}

.sidebar-subtitle {
  font-size: 0.7rem;
  color: #94a3b8;
  font-weight: 500;
}

.sidebar-close-btn {
  display: none;
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 1.6rem;
  cursor: pointer;
}

/* Sidebar Wallet Box */
.sidebar-wallet-card {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-md);
  padding: 0.9rem 1rem;
  margin: 1.15rem 0;
}

.wallet-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #94a3b8;
  display: block;
}

.wallet-amount {
  font-family: var(--font-mono);
  font-size: 1.35rem;
  font-weight: 700;
  color: #34d399;
  display: block;
  margin: 0.15rem 0 0.35rem;
}

.wallet-amount.text-danger {
  color: #f87171;
}

.wallet-cycle-tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 600;
  background-color: rgba(59, 130, 246, 0.2);
  color: #93c5fd;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-sm);
}

.sidebar-menu-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: #64748b;
  padding: 0 0.65rem;
  margin-bottom: 0.4rem;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  flex: 1;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.7rem 0.8rem;
  border-radius: var(--radius-md);
  border: none;
  background: transparent;
  color: #cbd5e1;
  font-family: var(--font-main);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
}

.nav-item:hover {
  background-color: rgba(255, 255, 255, 0.06);
  color: #ffffff;
}

.nav-item.active {
  background-color: var(--color-brand);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

.nav-item-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-item-label {
  flex: 1;
}

.nav-item-badge {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-full);
}

.nav-badge-green {
  background-color: rgba(16, 185, 129, 0.2);
  color: #6ee7b7;
}

.nav-badge-rose {
  background-color: rgba(239, 68, 68, 0.2);
  color: #fca5a5;
}

.nav-badge-neutral {
  background-color: rgba(255, 255, 255, 0.15);
  color: #e2e8f0;
}

/* Sidebar Footer */
.sidebar-footer {
  padding-top: 1rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.sidebar-user-card {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background-color 0.15s ease;
}

.sidebar-user-card:hover {
  background-color: rgba(255, 255, 255, 0.06);
}

.user-avatar {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  color: #ffffff;
  flex-shrink: 0;
}

.user-meta {
  overflow: hidden;
}

.user-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 0.72rem;
  color: #94a3b8;
}

.btn-logout {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.6rem;
  border-radius: var(--radius-md);
  border: 1px solid rgba(239, 68, 68, 0.35);
  background-color: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  font-family: var(--font-main);
  font-size: 0.825rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-logout:hover {
  background-color: var(--color-expense);
  color: #ffffff;
}

/* Main Content Area & Top Bar */
.app-main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.app-topbar {
  background-color: #ffffff;
  border-bottom: 1px solid var(--color-border);
  padding: 1rem 2rem;
  position: sticky;
  top: 0;
  z-index: 40;
}

.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.mobile-menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 0.4rem;
  color: var(--color-primary);
  cursor: pointer;
}

.topbar-title {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--color-primary);
  line-height: 1.2;
}

.topbar-subtitle {
  font-size: 0.8rem;
  color: var(--color-text-muted);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.topbar-quick-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.topbar-profile-pill {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3rem 0.65rem 0.3rem 0.3rem;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  background-color: var(--color-bg-subtle);
  cursor: pointer;
  font-family: var(--font-main);
  transition: border-color 0.15s ease;
}

.topbar-profile-pill:hover {
  border-color: var(--color-brand);
}

.user-avatar-sm {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  color: #ffffff;
  font-size: 0.72rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.topbar-username {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--color-primary);
}

/* Mobile Responsive Sidebar Drawer */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.55);
  z-index: 55;
}

@media (max-width: 960px) {
  .app-sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
  }
  .app-sidebar.sidebar-open {
    transform: translateX(0);
  }
  .sidebar-close-btn {
    display: block;
  }
  .mobile-menu-btn {
    display: inline-flex;
  }
  .app-topbar {
    padding: 0.85rem 1.25rem;
  }
  .topbar-quick-actions {
    display: none;
  }
}

/* ==========================================================================
   4. Page Viewport & Shared Containers
   ========================================================================== */
.page-viewport {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 1.75rem 2rem 3rem;
}

@media (max-width: 768px) {
  .page-viewport {
    padding: 1.25rem 1rem 2.5rem;
  }
}

.page-section {
  animation: fadeInPage 0.2s ease;
}

@keyframes fadeInPage {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ==========================================================================
   5. Dashboard Page Components
   ========================================================================== */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

@media (max-width: 1150px) {
  .dashboard-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
}

.metric-card {
  background-color: var(--color-bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  padding: 1.25rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}

.card-header-flex {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.65rem;
}

.card-label {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
}

.card-icon-wrap {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-income {
  background-color: var(--color-income-bg);
  color: var(--color-income-hover);
}

.icon-expense {
  background-color: var(--color-expense-bg);
  color: var(--color-expense-hover);
}

.icon-summary {
  background-color: var(--color-brand-light);
  color: var(--color-brand);
}

.card-value {
  font-family: var(--font-mono);
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.35rem;
}

.balance-value { color: var(--color-text-main); }
.income-value { color: var(--color-income-hover); }
.expense-value { color: var(--color-expense-hover); }
.summary-value { color: var(--color-primary); }

.card-subtext {
  font-size: 0.775rem;
  color: var(--color-text-muted);
}

.formula-code {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  background-color: var(--color-bg-page);
  padding: 0.1rem 0.35rem;
  border-radius: var(--radius-sm);
}

.status-explanation {
  font-size: 0.75rem;
  margin-top: 0.45rem;
  font-weight: 600;
}

.card-balance.status-positive { border-left: 4px solid var(--color-income); }
.card-balance.status-positive .status-explanation { color: var(--color-income-hover); }

.card-balance.status-warning { border-left: 4px solid var(--color-warning); }
.card-balance.status-warning .status-explanation { color: #b45309; }

.card-balance.status-negative { border-left: 4px solid var(--color-expense); background-color: #fffafb; }
.card-balance.status-negative .status-explanation { color: var(--color-expense-hover); }

.status-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-full);
}

.status-badge.status-positive { background-color: var(--color-income-bg); color: var(--color-income-hover); }
.status-badge.status-warning { background-color: var(--color-warning-bg); color: #b45309; }
.status-badge.status-negative { background-color: var(--color-expense-bg); color: var(--color-expense-hover); }

.budget-progress-mini {
  width: 100%;
  height: 6px;
  background-color: var(--color-bg-page);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin: 0.3rem 0 0.45rem;
}

.budget-progress-bar {
  height: 100%;
  background-color: var(--color-brand);
  border-radius: var(--radius-full);
}

.budget-progress-bar.bar-danger {
  background-color: var(--color-expense);
}

/* Dashboard Split Grid */
.dashboard-split-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

@media (max-width: 900px) {
  .dashboard-split-grid {
    grid-template-columns: 1fr;
  }
}

.card {
  background-color: var(--color-bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}

.panel-card {
  display: flex;
  flex-direction: column;
}

.panel-header {
  padding: 1.15rem 1.35rem;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 0.98rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--color-primary);
}

.section-title-icon {
  color: var(--color-brand);
}

.panel-body {
  padding: 1.25rem 1.35rem;
}

.panel-body.no-padding {
  padding: 0;
}

.btn-link {
  background: none;
  border: none;
  color: var(--color-brand);
  font-family: var(--font-main);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}

.btn-link:hover {
  text-decoration: underline;
}

  <script>

(function() {
  'use strict';

  // --- BASE VIEW ---
  /**
 * View.js
 * Base View Class for PennyWise MVC Framework
 * 
 * Implements standard View layer mechanics:
 * - Rendering templates to parent containers
 * - Currency formatting in Philippine Peso (₱)
 * - Readable date formatting
 * - HTML escaping for security
 */

class View {
  _data;

  /**
   * Render the received data to the DOM
   * @param {Object|Array} data The data to be rendered
   */
  render(data) {
    this._data = data;
    const markup = this._generateMarkup();
    this._clear();
    if (this._parentElement) {
      this._parentElement.insertAdjacentHTML('afterbegin', markup);
    }
  }

  /**
   * Clear parent container innerHTML
   * @protected
   */
  _clear() {
    if (this._parentElement) {
      this._parentElement.innerHTML = '';
    }
  }

  /**
   * Format numbers as Philippine Peso (₱)
   * @param {number} amount 
   * @returns {string} e.g., "₱1,500.00"
   */
  formatCurrency(amount) {
    const num = Number(amount) || 0;
    const isNeg = num < 0;
    const absVal = Math.abs(num);
    return (isNeg ? '-₱' : '₱') + absVal.toLocaleString('en-PH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  /**
   * Format ISO date string (YYYY-MM-DD) into readable format
   * @param {string} dateString 
   * @returns {string} e.g., "Nov 4, 2026"
   */
  formatDate(dateString) {
    if (!dateString) return 'N/A';
    const parts = dateString.split('-');
    if (parts.length === 3) {
      const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (!isNaN(date.getTime())) {
        return date.toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        });
      }
    }
    const fallback = new Date(dateString);
    if (isNaN(fallback.getTime())) return dateString;
    return fallback.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric',
    });
  }

  /**
   * Escape HTML special characters to prevent XSS
   * @param {string} str 
   * @returns {string}
   */
  escapeHTML(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /**
   * Get initials from full name
   * @param {string} name 
   * @returns {string}
   */
  getInitials(name) {
    if (!name) return 'ST';
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
}


  // --- MODEL LAYER ---
  /**
 * model.js
 * Production Model Layer for PennyWise — Student Allowance & Expense Management System
 * 
 * Capabilities:
 * - Multi-user Registration, Login, Logout & Session Persistence
 * - Editable Student Profile (Full Name, Student ID, Course/Year, University, Budget Goal, Password)
 * - Multi-page Navigation Route State ('dashboard', 'allowance', 'expense', 'transactions', 'profile')
 * - Per-user Transaction Ledger (Income & Expense CRUD)
 * - Automatic Derived Financial Calculations (Balance, Total Allowance, Total Expenses, Daily Average, Savings Rate, Category Breakdown)
 * - CSV Export & Account Data Management
 */

const USERS_STORAGE_KEY = 'pennywise_users_db_v2';
const SESSION_STORAGE_KEY = 'pennywise_active_session_v2';
const TX_STORAGE_PREFIX = 'pennywise_tx_user_';

const state = {
  currentUser: null,        // null when logged out, or user object when logged in
  currentPage: 'dashboard', // 'dashboard' | 'allowance' | 'expense' | 'transactions' | 'profile'
  authMode: 'login',        // 'login' | 'register'
  transactions: [],
  totals: {
    totalIncome: 0,
    totalExpenses: 0,
    balance: 0,
    transactionCount: 0,
    allowanceCount: 0,
    expenseCount: 0,
    savingsRate: 0,
    budgetGoal: 2000,
    budgetRemaining: 2000,
    budgetUsedPercent: 0,
  },
  categoryBreakdown: [],
  allowanceBreakdown: [],
  currentFilter: {
    type: 'all',
    category: 'all',
    searchQuery: '',
    sortBy: 'newest', // 'newest' | 'oldest' | 'highest' | 'lowest'
  },
};

/* ==========================================================================
   1. Storage Helpers
   ========================================================================== */
const getStoredUsers = function () {
  try {
    const raw = localStorage.getItem(USERS_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (err) {
    console.error('Error reading users from localStorage:', err);
  }
  return [];
};

const saveStoredUsers = function (users) {
  try {
    localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
  } catch (err) {
    console.error('Error saving users to localStorage:', err);
  }
};

const persistCurrentUserTransactions = function () {
  if (!state.currentUser) return;
  try {
    const txKey = TX_STORAGE_PREFIX + state.currentUser.id;
    localStorage.setItem(txKey, JSON.stringify(state.transactions));
  } catch (err) {
    console.error('Error saving user transactions:', err);
  }
};

const loadUserTransactions = function (userId) {
  try {
    const txKey = TX_STORAGE_PREFIX + userId;
    const raw = localStorage.getItem(txKey);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        state.transactions = parsed;
        calculateTotals();
        return;
      }
    }
  } catch (err) {
    console.error('Error loading user transactions:', err);
  }
  state.transactions = [];
  persistCurrentUserTransactions();
  calculateTotals();
};

/* ==========================================================================
   2. Authentication & Session Management
   ========================================================================== */

/**
 * Restore active session on app boot
 */
const initSession = function () {
  const users = getStoredUsers();
  try {
    const sessionUserId = localStorage.getItem(SESSION_STORAGE_KEY);
    if (sessionUserId) {
      const found = users.find((u) => u.id === sessionUserId);
      if (found) {
        state.currentUser = { ...found };
        loadUserTransactions(found.id);
        return;
      }
    }
  } catch (err) {
    console.error('Session restore failed:', err);
  }
  // If no session exists yet, stays null (shows Login screen)
  state.currentUser = null;
  state.transactions = [];
};

/**
 * Register a brand new student account
 * @param {Object} userData { fullName, email, password, studentId, course, university, allowanceCycle, budgetGoal }
 */
const registerUser = function (userData) {
  const fullName = (userData.fullName || '').trim();
  const email = (userData.email || '').trim().toLowerCase();
  const password = userData.password || '';

  if (!fullName) throw new Error('Please enter your full name.');
  if (!email || !email.includes('@')) throw new Error('Please enter a valid email address.');
  if (password.length < 6) throw new Error('Password must be at least 6 characters long.');

  const users = getStoredUsers();
  const existing = users.find((u) => u.email.toLowerCase() === email);
  if (existing) {
    throw new Error('An account with this email already exists. Please log in instead.');
  }

  const colors = ['#2563eb', '#059669', '#7c3aed', '#db2777', '#d97706', '#0891b2'];
  const randomColor = colors[users.length % colors.length];

  const newUser = {
    id: 'usr-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
    fullName,
    email,
    password,
    studentId: (userData.studentId || '').trim(),
    course: (userData.course || 'College Student').trim(),
    university: (userData.university || 'Davao Oriental State University').trim(),
    allowanceCycle: userData.allowanceCycle || 'Weekly',
    budgetGoal: Number(userData.budgetGoal) > 0 ? Number(userData.budgetGoal) : 1500,
    avatarColor: randomColor,
    createdAt: new Date().toISOString().split('T')[0],
  };

  users.push(newUser);
  saveStoredUsers(users);

  state.currentUser = { ...newUser };
  state.transactions = [];
  persistCurrentUserTransactions();
  calculateTotals();

  try {
    localStorage.setItem(SESSION_STORAGE_KEY, newUser.id);
  } catch (e) {}

  state.currentPage = 'dashboard';
  return state.currentUser;
};

/**
 * Log in an existing student account
 * @param {string} email 
 * @param {string} password 
 */
const loginUser = function (email, password) {
  const cleanEmail = (email || '').trim().toLowerCase();
  if (!cleanEmail) throw new Error('Please enter your email address.');
  if (!password) throw new Error('Please enter your password.');

  const users = getStoredUsers();
  const user = users.find((u) => u.email.toLowerCase() === cleanEmail && u.password === password);

  if (!user) {
    throw new Error('Invalid email or password. Please check your credentials or create a new account.');
  }

  state.currentUser = { ...user };
  loadUserTransactions(user.id);
  state.currentPage = 'dashboard';

  try {
    localStorage.setItem(SESSION_STORAGE_KEY, user.id);
  } catch (e) {}

  return state.currentUser;
};

/**
 * Log out current student
 */
const logoutUser = function () {
  state.currentUser = null;
  state.transactions = [];
  state.currentPage = 'dashboard';
  state.authMode = 'login';
  try {
    localStorage.removeItem(SESSION_STORAGE_KEY);
  } catch (e) {}
};

/**
 * Update current user's profile information
 * @param {Object} profileUpdates 
 */
const updateUserProfile = function (profileUpdates) {
  if (!state.currentUser) throw new Error('No active user session.');

  const fullName = (profileUpdates.fullName || '').trim();
  const email = (profileUpdates.email || '').trim().toLowerCase();

  if (!fullName) throw new Error('Full Name cannot be empty.');
  if (!email || !email.includes('@')) throw new Error('Please provide a valid email address.');

  const users = getStoredUsers();
  const emailConflict = users.find(
    (u) => u.email.toLowerCase() === email && u.id !== state.currentUser.id
  );
  if (emailConflict) {
    throw new Error('That email address is already in use by another account.');
  }

  const budgetGoal = Number(profileUpdates.budgetGoal);
  if (isNaN(budgetGoal) || budgetGoal < 0) {
    throw new Error('Spending budget goal must be a valid non-negative number.');
  }

  const updatedUser = {
    ...state.currentUser,
    fullName,
    email,
    studentId: (profileUpdates.studentId || '').trim(),
    course: (profileUpdates.course || '').trim(),
    university: (profileUpdates.university || '').trim(),
    allowanceCycle: profileUpdates.allowanceCycle || state.currentUser.allowanceCycle,
    budgetGoal: Number(budgetGoal.toFixed(2)),
    avatarColor: profileUpdates.avatarColor || state.currentUser.avatarColor,
  };

  if (profileUpdates.newPassword && profileUpdates.newPassword.trim() !== '') {
    if (profileUpdates.newPassword.length < 6) {
      throw new Error('New password must be at least 6 characters.');
    }
    updatedUser.password = profileUpdates.newPassword;
  }

  const idx = users.findIndex((u) => u.id === state.currentUser.id);
  if (idx !== -1) {
    users[idx] = updatedUser;
    saveStoredUsers(users);
  }

  state.currentUser = updatedUser;
  calculateTotals();
  return state.currentUser;
};

/* ==========================================================================
   3. Navigation & View State
   ========================================================================== */
const setPage = function (pageName) {
  const validPages = ['dashboard', 'allowance', 'expense', 'transactions', 'profile'];
  if (validPages.includes(pageName)) {
    state.currentPage = pageName;
  }
};

const setAuthMode = function (mode) {
  state.authMode = mode === 'register' ? 'register' : 'login';
};

/* ==========================================================================
   4. Automatic Financial Calculations (Derived Values)
   ========================================================================== */
const calculateTotals = function () {
  let income = 0;
  let expenses = 0;
  let allowanceCount = 0;
  let expenseCount = 0;
  const expByCat = {};
  const incByCat = {};

  state.transactions.forEach((tx) => {
    const amt = Number(tx.amount) || 0;
    if (tx.type === 'income') {
      income += amt;
      allowanceCount++;
      const cat = tx.category || 'Other Allowance';
      incByCat[cat] = (incByCat[cat] || 0) + amt;
    } else {
      expenses += amt;
      expenseCount++;
      const cat = tx.category || 'Other Expenses';
      expByCat[cat] = (expByCat[cat] || 0) + amt;
    }
  });

  const balance = income - expenses;
  const savingsRate = income > 0 ? Math.max(0, ((income - expenses) / income) * 100) : 0;
  const budgetGoal = state.currentUser ? Number(state.currentUser.budgetGoal) || 1500 : 1500;
  const budgetRemaining = budgetGoal - expenses;
  const budgetUsedPercent = budgetGoal > 0 ? Math.min(100, (expenses / budgetGoal) * 100) : 0;

  state.totals = {
    totalIncome: Number(income.toFixed(2)),
    totalExpenses: Number(expenses.toFixed(2)),
    balance: Number(balance.toFixed(2)),
    transactionCount: state.transactions.length,
    allowanceCount,
    expenseCount,
    savingsRate: Number(savingsRate.toFixed(1)),
    budgetGoal: Number(budgetGoal.toFixed(2)),
    budgetRemaining: Number(budgetRemaining.toFixed(2)),
    budgetUsedPercent: Number(budgetUsedPercent.toFixed(1)),
  };

  state.categoryBreakdown = Object.keys(expByCat)
    .map((category) => {
      const total = expByCat[category];
      const percentage = expenses > 0 ? (total / expenses) * 100 : 0;
      return {
        category,
        total: Number(total.toFixed(2)),
        percentage: Number(percentage.toFixed(1)),
      };
    })
    .sort((a, b) => b.total - a.total);

  state.allowanceBreakdown = Object.keys(incByCat)
    .map((category) => {
      const total = incByCat[category];
      const percentage = income > 0 ? (total / income) * 100 : 0;
      return {
        category,
        total: Number(total.toFixed(2)),
        percentage: Number(percentage.toFixed(1)),
      };
    })
    .sort((a, b) => b.total - a.total);
};

/* ==========================================================================
   5. Transaction CRUD Operations
   ========================================================================== */
const addTransaction = function (txData) {
  const amount = Number(txData.amount);
  if (isNaN(amount) || amount <= 0) {
    throw new Error('Transaction amount must be a positive number greater than ₱0.00.');
  }
  const description = (txData.description || '').trim();
  if (!description) {
    throw new Error('Transaction description cannot be empty.');
  }

  const newTx = {
    id: 'tx-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
    type: txData.type === 'income' ? 'income' : 'expense',
    amount: Number(amount.toFixed(2)),
    description,
    category: txData.category || (txData.type === 'income' ? 'Weekly Allowance' : 'Food & Drinks'),
    paymentMethod: txData.paymentMethod || 'Cash',
    date: txData.date || new Date().toISOString().split('T')[0],
    createdAt: Date.now(),
  };

  state.transactions.unshift(newTx);
  calculateTotals();
  persistCurrentUserTransactions();
  return newTx;
};

const editTransaction = function (id, updatedData) {
  const index = state.transactions.findIndex((tx) => tx.id === id);
  if (index === -1) {
    throw new Error('Transaction record not found.');
  }

  const amount = Number(updatedData.amount);
  if (isNaN(amount) || amount <= 0) {
    throw new Error('Amount must be greater than ₱0.00.');
  }
  const description = (updatedData.description || '').trim();
  if (!description) {
    throw new Error('Description cannot be empty.');
  }

  state.transactions[index] = {
    ...state.transactions[index],
    amount: Number(amount.toFixed(2)),
    description,
    category: updatedData.category || state.transactions[index].category,
    paymentMethod: updatedData.paymentMethod || state.transactions[index].paymentMethod || 'Cash',
    date: updatedData.date || state.transactions[index].date,
    updatedAt: Date.now(),
  };

  calculateTotals();
  persistCurrentUserTransactions();
  return state.transactions[index];
};

const deleteTransaction = function (id) {
  const initialLen = state.transactions.length;
  state.transactions = state.transactions.filter((tx) => tx.id !== id);
  if (state.transactions.length === initialLen) {
    throw new Error('Transaction could not be found to delete.');
  }
  calculateTotals();
  persistCurrentUserTransactions();
  return true;
};

const getTransactionById = function (id) {
  return state.transactions.find((tx) => tx.id === id) || null;
};

const getAllowances = function () {
  return state.transactions.filter((tx) => tx.type === 'income');
};

const getExpenses = function () {
  return state.transactions.filter((tx) => tx.type === 'expense');
};

const clearAllUserTransactions = function () {
  state.transactions = [];
  calculateTotals();
  persistCurrentUserTransactions();
};

/* ==========================================================================
   6. Filtering, Sorting & CSV Export
   ========================================================================== */
const setFilter = function (filterUpdates) {
  state.currentFilter = {
    ...state.currentFilter,
    ...filterUpdates,
  };
};

const getFilteredTransactions = function () {
  const { type, category, searchQuery, sortBy } = state.currentFilter;

  const filtered = state.transactions.filter((tx) => {
    if (type && type !== 'all' && tx.type !== type) return false;
    if (category && category !== 'all' && tx.category !== category) return false;
    if (searchQuery && searchQuery.trim() !== '') {
      const q = searchQuery.toLowerCase().trim();
      const matchDesc = tx.description.toLowerCase().includes(q);
      const matchCat = tx.category.toLowerCase().includes(q);
      const matchMethod = (tx.paymentMethod || '').toLowerCase().includes(q);
      if (!matchDesc && !matchCat && !matchMethod) return false;
    }
    return true;
  });

  return filtered.sort((a, b) => {
    if (sortBy === 'oldest') {
      return new Date(a.date) - new Date(b.date) || a.createdAt - b.createdAt;
    }
    if (sortBy === 'highest') {
      return b.amount - a.amount;
    }
    if (sortBy === 'lowest') {
      return a.amount - b.amount;
    }
    // default: newest
    return new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt;
  });
};

const getAllUniqueCategories = function () {
  const set = new Set();
  state.transactions.forEach((tx) => {
    if (tx.category) set.add(tx.category);
  });
  return Array.from(set).sort();
};

const exportTransactionsCSV = function () {
  const rows = [
    ['Date', 'Type', 'Category', 'Description', 'Payment Method', 'Amount (PHP)'],
  ];
  state.transactions.forEach((tx) => {
    const sign = tx.type === 'income' ? '' : '-';
    rows.push([
      tx.date,
      tx.type === 'income' ? 'Allowance' : 'Expense',
      `"${(tx.category || '').replace(/"/g, '""')}"`,
      `"${(tx.description || '').replace(/"/g, '""')}"`,
      `"${(tx.paymentMethod || 'Cash').replace(/"/g, '""')}"`,
      `${sign}${tx.amount.toFixed(2)}`,
    ]);
  });
  return rows.map((r) => r.join(',')).join('\n');
};

const model = {
  state,
  initSession,
  registerUser,
  loginUser,
  logoutUser,
  updateUserProfile,
  setPage,
  setAuthMode,
  calculateTotals,
  addTransaction,
  editTransaction,
  deleteTransaction,
  getTransactionById,
  getAllowances,
  getExpenses,
  clearAllUserTransactions,
  setFilter,
  getFilteredTransactions,
  getAllUniqueCategories,
  exportTransactionsCSV
};

  /**
   * Bind authentication events (Login, Register, Mode Switch)
   */
  addHandlerAuth(handlers) {
    if (!this._parentElement) return;

    this._parentElement.addEventListener('click', (e) => {
      // Switch mode tab
      const tabBtn = e.target.closest('.auth-tab');
      if (tabBtn) {
        handlers.onSwitchMode(tabBtn.dataset.mode);
        return;
      }

      // Switch mode link
      const switchBtn = e.target.closest('[data-switch-mode]');
      if (switchBtn) {
        handlers.onSwitchMode(switchBtn.dataset.switchMode);
        return;
      }

    });

    this._parentElement.addEventListener('submit', (e) => {
      if (e.target.id === 'form-login') {
        e.preventDefault();
        const email = document.querySelector('#login-email')?.value || '';
        const password = document.querySelector('#login-password')?.value || '';
        handlers.onLogin(email, password);
      } else if (e.target.id === 'form-register') {
        e.preventDefault();
        const userData = {
          fullName: document.querySelector('#reg-fullname')?.value || '',
          studentId: document.querySelector('#reg-student-id')?.value || '',
          email: document.querySelector('#reg-email')?.value || '',
          course: document.querySelector('#reg-course')?.value || '',
          budgetGoal: document.querySelector('#reg-budget')?.value || 1500,
          university: document.querySelector('#reg-university')?.value || '',
          password: document.querySelector('#reg-password')?.value || '',
        };
        handlers.onRegister(userData);
      }
    });
  }

  showError(msg) {
    const box = document.querySelector('#auth-error-box');
    if (!box) return;
    box.innerHTML = `
      <div class="alert alert-error">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span>${this.escapeHTML(msg)}</span>
      </div>
    `;
    box.classList.remove('hidden');
  }
}

        const targetPage = navTrigger.dataset.navPage;
        this._closeMobileDrawer();
        handler(targetPage);
      }

    if (this._sidebarElement) {
      this._sidebarElement.addEventListener('click', (e) => {
        if (e.target.closest('#btn-close-sidebar')) {
          this._closeMobileDrawer();
          return;
        }
        handleNavClick(e);
      });
    }

        if (e.target.closest('#btn-open-sidebar')) {
          this._openMobileDrawer();
          return;
        }
        handleNavClick(e);
      });
    }

    const overlay = document.querySelector('#sidebar-overlay');
    if (overlay) {
      overlay.addEventListener('click', () => this._closeMobileDrawer());
    }
  }

  addHandlerLogout(handler) {
    if (!this._sidebarElement) return;
    this._sidebarElement.addEventListener('click', (e) => {
      const logoutBtn = e.target.closest('#btn-sidebar-logout');

        handler();

    this._sidebarElement?.classList.add('sidebar-open');

    document.querySelector('#sidebar-overlay')?.classList.add('hidden');
  }
}

  addHandlerActions(handlers) {
    if (!this._parentElement) return;

    this._parentElement.addEventListener('click', (e) => {
      const resetBtn = e.target.closest('#btn-reset-allowance');
      if (resetBtn) {
        const form = this._parentElement.querySelector('#form-add-allowance');
        if (form) {
          form.reset();
          this.hideError();
          const dateInput = form.querySelector('#allowance-date');
          if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
        }
        return;
      }

      const editBtn = e.target.closest('.btn-edit');
      if (editBtn && handlers.onEdit) {
        handlers.onEdit(editBtn.dataset.id);
        return;
      }

      const deleteBtn = e.target.closest('.btn-delete');
      if (deleteBtn && handlers.onDelete) {
        handlers.onDelete(deleteBtn.dataset.id);
      }
    });

    this._parentElement.addEventListener('submit', (e) => {
      if (e.target.id !== 'form-add-allowance') return;
      e.preventDefault();

      const form = e.target;
      const amountInput = form.querySelector('#allowance-amount');
      const descInput = form.querySelector('#allowance-desc');
      const categorySelect = form.querySelector('#allowance-category');
      const methodSelect = form.querySelector('#allowance-method');
      const dateInput = form.querySelector('#allowance-date');

      const rawAmount = amountInput.value.trim();
      const rawDesc = descInput.value.trim();
      const amount = parseFloat(rawAmount);

      if (!rawDesc) {
        this.showError('Description is required. Please specify where this allowance came from.');
        descInput.focus();
        return;
      }

      if (rawAmount === '' || isNaN(amount) || amount <= 0) {
        this.showError('Please enter a valid allowance amount greater than ₱0.00.');
        amountInput.focus();
        return;
      }

      this.hideError();

      handlers.onAdd({
        type: 'income',
        amount: Number(amount.toFixed(2)),
        description: rawDesc,
        category: categorySelect.value || 'Weekly Allowance',
        paymentMethod: methodSelect?.value || 'Cash',
        date: dateInput.value || new Date().toISOString().split('T')[0],
      });
    });
  }

  showError(msg) {
    const errorBox = document.querySelector('#allowance-error-box');
    if (!errorBox) return;
    errorBox.innerHTML = `
      <div class="alert alert-error">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span>${this.escapeHTML(msg)}</span>
      </div>
    `;
    errorBox.classList.remove('hidden');
  }

  hideError() {
    const errorBox = document.querySelector('#allowance-error-box');
    if (errorBox) {
      errorBox.innerHTML = '';
      errorBox.classList.add('hidden');
    }
  }
}

          if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
        }
        return;
      }

      const editBtn = e.target.closest('.btn-edit');
      if (editBtn && handlers.onEdit) {
        handlers.onEdit(editBtn.dataset.id);
        return;
      }

      const deleteBtn = e.target.closest('.btn-delete');
      if (deleteBtn && handlers.onDelete) {
        handlers.onDelete(deleteBtn.dataset.id);
      }
    });

    this._parentElement.addEventListener('submit', (e) => {
      if (e.target.id !== 'form-add-expense') return;
      e.preventDefault();

      const form = e.target;
      const amountInput = form.querySelector('#expense-amount');
      const descInput = form.querySelector('#expense-desc');
      const categorySelect = form.querySelector('#expense-category');
      const methodSelect = form.querySelector('#expense-method');
      const dateInput = form.querySelector('#expense-date');

      const rawAmount = amountInput.value.trim();
      const rawDesc = descInput.value.trim();
      const amount = parseFloat(rawAmount);

      if (!rawDesc) {
        this.showError('Description is required. Please specify what you spent on.');
        descInput.focus();
        return;
      }

      if (rawAmount === '' || isNaN(amount) || amount <= 0) {
        this.showError('Please enter a valid expense amount greater than ₱0.00.');
        amountInput.focus();
        return;
      }

      this.hideError();

      handlers.onAdd({
        type: 'expense',
        amount: Number(amount.toFixed(2)),
        description: rawDesc,
        category: categorySelect.value || 'Food & Drinks',
        paymentMethod: methodSelect?.value || 'Cash',
        date: dateInput.value || new Date().toISOString().split('T')[0],
      });
    });
  }

  showError(msg) {
    const errorBox = document.querySelector('#expense-error-box');
    if (!errorBox) return;
    errorBox.innerHTML = `
      <div class="alert alert-error">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span>${this.escapeHTML(msg)}</span>
      </div>
    `;
    errorBox.classList.remove('hidden');
  }

  hideError() {
    const errorBox = document.querySelector('#expense-error-box');
    if (errorBox) {
      errorBox.innerHTML = '';
      errorBox.classList.add('hidden');
    }
  }
}

        </div>
        <div class="history-stat-item">
          <span>Filtered Expenses</span>
          <strong class="tx-amount-expense">-${this.formatCurrency(filteredExpense)}</strong>
        </div>
        <div class="history-stat-item">
          <span>Net Total</span>
          <strong>${this.formatCurrency(filteredNet)}</strong>
        </div>

        <div class="transaction-toolbar">
          <div class="toolbar-controls-full">

              <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
              <input 
                type="text" 
                id="tx-search-input" 
                class="form-control search-field" 
                placeholder="Search description, category, or method..." 
                value="${this.escapeHTML(filter.searchQuery || '')}"
              />

            <!-- Type Filter -->
            <select id="tx-filter-type" class="form-control filter-select">
              <option value="all" ${filter.type === 'all' ? 'selected' : ''}>All Types</option>
              <option value="income" ${filter.type === 'income' ? 'selected' : ''}>Allowances Only (+)</option>
              <option value="expense" ${filter.type === 'expense' ? 'selected' : ''}>Expenses Only (-)</option>

              <option value="oldest" ${filter.sortBy === 'oldest' ? 'selected' : ''}>Oldest First</option>
              <option value="highest" ${filter.sortBy === 'highest' ? 'selected' : ''}>Highest Amount</option>

  addHandlerActions(handlers) {
    if (!this._parentElement) return;

    this._parentElement.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.btn-edit');
      if (editBtn && handlers.onEdit) {
        handlers.onEdit(editBtn.dataset.id);
        return;
      }

      const deleteBtn = e.target.closest('.btn-delete');
      if (deleteBtn && handlers.onDelete) {
        handlers.onDelete(deleteBtn.dataset.id);
        return;
      }

      const exportBtn = e.target.closest('#btn-export-csv');
      if (exportBtn && handlers.onExportCSV) {
        handlers.onExportCSV();

        handlers.onFilter({ sortBy: e.target.value });

          input.focus();
          input.setSelectionRange(val.length, val.length);
        }
      }
    });

  /**

 * 
 * Coordinates:
 * - Authentication (Login, Register, Logout, Session Recovery)
 * - Multi-Page Navigation Router ('dashboard', 'allowance', 'expense', 'transactions', 'profile')

/* ==========================================================================
   1. Toast Notification System
   ========================================================================== */
const showToast = function (message, type = 'success') {
  const toastContainer = document.querySelector('#toast-container');
  if (!toastContainer) return;

  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `<span class="toast-message">${message}</span>`;
  toastContainer.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('toast-fade-out');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
};

/* ==========================================================================
   2. Master Layout & Multi-Page Renderer
   ========================================================================== */
const renderApp = function () {
  const authScreen = document.querySelector('#auth-container');
  const appShell = document.querySelector('#app-shell');

  // If no user is logged in, show Login / Register screen
  if (!model.state.currentUser) {
    authScreen?.classList.remove('hidden');
    appShell?.classList.add('hidden');
    authView.render(model.state);
    return;
  }

  // User is logged in: hide Auth screen, show App Shell
  authScreen?.classList.add('hidden');
  appShell?.classList.remove('hidden');

  // Render Sidebar Menu & Top Bar
  navigationView.render(model.state);

  // Toggle active page section visibility
  const pageIds = ['dashboard', 'allowance', 'expense', 'transactions', 'profile'];
  pageIds.forEach((id) => {
    const el = document.querySelector(`#page-${id}`);
    if (el) {
      if (id === model.state.currentPage) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }
  });

  // Render the active page's View with fresh state
  const current = model.state.currentPage;
  if (current === 'dashboard') {
    dashboardView.render(model.state);
  } else if (current === 'allowance') {
    allowanceView.render({
      totals: model.state.totals,
      allowances: model.getAllowances(),
      allowanceBreakdown: model.state.allowanceBreakdown,
    });
  } else if (current === 'expense') {
    expenseView.render({
      totals: model.state.totals,
      expenses: model.getExpenses(),
      categoryBreakdown: model.state.categoryBreakdown,
    });
  } else if (current === 'transactions') {
    transactionView.render({
      transactions: model.getFilteredTransactions(),
      filter: model.state.currentFilter,
      categories: model.getAllUniqueCategories(),
    });
  } else if (current === 'profile') {
    profileView.render(model.state);
  }
};

/* ==========================================================================
   3. Authentication Controllers
   ========================================================================== */
const controlAuthSwitchMode = function (mode) {
  model.setAuthMode(mode);
  authView.render(model.state);
};

const controlLogin = function (email, password) {
  try {
    const user = model.loginUser(email, password);
    renderApp();
    showToast(`Welcome back, ${user.fullName}!`, 'success');
  } catch (err) {
    authView.showError(err.message);
  }
};

const controlRegister = function (userData) {
  try {
    const user = model.registerUser(userData);
    renderApp();
    showToast(`Account created! Welcome to PennyWise, ${user.fullName}.`, 'success');
  } catch (err) {
    authView.showError(err.message);
  }
};

const controlLogout = function () {
  showConfirmModal(
    'Sign Out',
    'Are you sure you want to log out of your PennyWise account?',
    () => {
      model.logoutUser();
      renderApp();
      showToast('You have been signed out safely.', 'info');
    }
  );
};

/* ==========================================================================
   4. Navigation Controller
   ========================================================================== */
const controlNavigate = function (targetPage) {
  model.setPage(targetPage);
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

/* ==========================================================================
   5. Transaction CRUD Controllers
   ========================================================================== */
const controlAddAllowance = function (txData) {
  try {
    const newTx = model.addTransaction(txData);
    renderApp();
    showToast(`Allowance of ₱${newTx.amount.toFixed(2)} saved!`, 'success');
  } catch (err) {
    allowanceView.showError(err.message);
  }
};

const controlAddExpense = function (txData) {
  try {
    const newTx = model.addTransaction(txData);
    renderApp();
    showToast(`Expense of ₱${newTx.amount.toFixed(2)} recorded!`, 'success');
  } catch (err) {
    expenseView.showError(err.message);
  }
};

const controlDeleteTransaction = function (id) {
  const tx = model.getTransactionById(id);
  if (!tx) {
    showToast('Transaction record not found.', 'error');
    return;
  }

  showConfirmModal(
    'Delete Transaction',
    `Are you sure you want to delete "${tx.description}" (${tx.type === 'income' ? '+' : '-'}₱${tx.amount.toFixed(2)})?`,
    () => {
      try {
        model.deleteTransaction(id);
        renderApp();
        showToast('Transaction deleted.', 'info');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  );
};

/* ==========================================================================
   6. Filter, Search & CSV Export Controllers
   ========================================================================== */
const controlFilterTransactions = function (filterOptions) {
  model.setFilter(filterOptions);
  transactionView.render({
    transactions: model.getFilteredTransactions(),
    filter: model.state.currentFilter,
    categories: model.getAllUniqueCategories(),
  });
};

const controlSearchTransactions = function (query) {
  model.setFilter({ searchQuery: query });
  transactionView.render({
    transactions: model.getFilteredTransactions(),
    filter: model.state.currentFilter,
    categories: model.getAllUniqueCategories(),
  });
};

const controlExportCSV = function () {
  try {
    const csvContent = model.exportTransactionsCSV();
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStr = new Date().toISOString().split('T')[0];
    link.setAttribute('href', url);
    link.setAttribute('download', `PennyWise_Transactions_${dateStr}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast('Transactions exported to CSV!', 'success');
  } catch (err) {
    showToast('Failed to export CSV.', 'error');
  }
};

/* ==========================================================================
   7. Profile & Account Settings Controllers
   ========================================================================== */
const controlUpdateProfile = function (updates) {
  try {
    model.updateUserProfile(updates);
    renderApp();
    profileView.showAlert('Your student profile and budget settings have been updated!', 'success');
    showToast('Profile saved!', 'success');
  } catch (err) {
    profileView.showAlert(err.message, 'error');
  }
};

const controlClearAllData = function () {
  showConfirmModal(
    'Clear All Records',
    'Are you sure you want to permanently delete all your recorded allowances and expenses? This cannot be undone.',
    () => {
      model.clearAllUserTransactions();
      renderApp();
      showToast('All transaction records cleared.', 'info');
    }
  );
};

/* ==========================================================================
   8. Edit Transaction Modal & Confirmation Modal
   ========================================================================== */
const editModal = document.querySelector('#edit-modal');
const editForm = document.querySelector('#form-edit-transaction');
const editErrorBox = document.querySelector('#edit-error-box');
let currentEditingId = null;

const controlEditTransaction = function (id) {
  const tx = model.getTransactionById(id);
  if (!tx) {
    showToast('Transaction not found.', 'error');
    return;
  }

  currentEditingId = tx.id;
  const modalTitle = document.querySelector('#edit-modal-title');
  const amountInput = document.querySelector('#edit-amount');
  const descInput = document.querySelector('#edit-desc');
  const categorySelect = document.querySelector('#edit-category');
  const methodSelect = document.querySelector('#edit-method');
  const dateInput = document.querySelector('#edit-date');

  if (modalTitle) {
    modalTitle.textContent = `Edit ${tx.type === 'income' ? 'Allowance' : 'Expense'}`;
  }
  if (amountInput) amountInput.value = tx.amount;
  if (descInput) descInput.value = tx.description;
  if (dateInput) dateInput.value = tx.date;
  if (methodSelect) methodSelect.value = tx.paymentMethod || 'Cash';

  if (categorySelect) {
    if (tx.type === 'income') {
      categorySelect.innerHTML = `
        <option value="Weekly Allowance">Weekly Allowance</option>
        <option value="Monthly Allowance">Monthly Allowance</option>
        <option value="Parents / Family">Parents / Family Support</option>
        <option value="Scholarship / Stipend">Scholarship / Stipend</option>
        <option value="Part-time Job">Part-time Job Earnings</option>
        <option value="Other Allowance">Other Income</option>
      `;
    } else {
      categorySelect.innerHTML = `
        <option value="Food & Drinks">Food & Drinks</option>
        <option value="Transportation">Transportation / Commute</option>
        <option value="School Supplies">School Supplies & Printing</option>
        <option value="Boarding House / Rent">Boarding House / Dorm Rent</option>
        <option value="Utilities & Load">Mobile Load & Internet</option>
        <option value="Personal Care">Personal Care & Hygiene</option>
        <option value="Leisure & Entertainment">Leisure & Socials</option>
        <option value="Other Expenses">Other Necessities</option>
      `;
    }
    categorySelect.value = tx.category;
  }

  if (editErrorBox) {
    editErrorBox.innerHTML = '';
    editErrorBox.classList.add('hidden');
  }

  editModal?.classList.remove('hidden');
};

const closeEditModal = function () {
  currentEditingId = null;
  editModal?.classList.add('hidden');
  editForm?.reset();
};

const setupEditModalListeners = function () {
  document.querySelector('#btn-close-modal')?.addEventListener('click', closeEditModal);
  document.querySelector('#btn-cancel-edit')?.addEventListener('click', closeEditModal);

  editModal?.addEventListener('click', (e) => {
    if (e.target === editModal) closeEditModal();
  });

  editForm?.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!currentEditingId) return;

    const amountInput = editForm.querySelector('#edit-amount');
    const descInput = editForm.querySelector('#edit-desc');
    const categorySelect = editForm.querySelector('#edit-category');
    const methodSelect = editForm.querySelector('#edit-method');
    const dateInput = editForm.querySelector('#edit-date');

    const rawAmount = amountInput.value.trim();
    const rawDesc = descInput.value.trim();
    const amount = parseFloat(rawAmount);

    if (!rawDesc) {
      if (editErrorBox) {
        editErrorBox.innerHTML = '<div class="alert alert-error"><span>Description cannot be empty.</span></div>';
        editErrorBox.classList.remove('hidden');
      }
      return;
    }

    if (rawAmount === '' || isNaN(amount) || amount <= 0) {
      if (editErrorBox) {
        editErrorBox.innerHTML = '<div class="alert alert-error"><span>Please enter an amount greater than ₱0.00.</span></div>';
        editErrorBox.classList.remove('hidden');
      }
      return;
    }

    try {
      model.editTransaction(currentEditingId, {
        amount,
        description: rawDesc,
        category: categorySelect.value,
        paymentMethod: methodSelect?.value || 'Cash',
        date: dateInput.value,
      });

      closeEditModal();
      renderApp();
      showToast('Transaction updated!', 'success');
    } catch (err) {
      if (editErrorBox) {
        editErrorBox.innerHTML = `<div class="alert alert-error"><span>${err.message}</span></div>`;
        editErrorBox.classList.remove('hidden');
      }
    }
  });
};

/* In-Page Confirmation Modal */
const confirmModal = document.querySelector('#confirm-modal');
const confirmTitle = document.querySelector('#confirm-modal-title');
const confirmMessage = document.querySelector('#confirm-modal-message');
let confirmCallback = null;

const showConfirmModal = function (title, message, onConfirm) {
  if (!confirmModal) {
    onConfirm();
    return;
  }
  if (confirmTitle) confirmTitle.textContent = title;
  if (confirmMessage) confirmMessage.textContent = message;
  confirmCallback = onConfirm;
  confirmModal.classList.remove('hidden');
};

const closeConfirmModal = function () {
  confirmCallback = null;
  confirmModal?.classList.add('hidden');
};

const setupConfirmModalListeners = function () {
  document.querySelector('#btn-close-confirm-modal')?.addEventListener('click', closeConfirmModal);
  document.querySelector('#btn-cancel-confirm')?.addEventListener('click', closeConfirmModal);
  document.querySelector('#btn-proceed-confirm')?.addEventListener('click', () => {
    if (typeof confirmCallback === 'function') {
      const cb = confirmCallback;
      closeConfirmModal();
      cb();
    } else {
      closeConfirmModal();
    }
  });
  confirmModal?.addEventListener('click', (e) => {
    if (e.target === confirmModal) closeConfirmModal();
  });
};

/* ==========================================================================
   9. Application Initialization
   ========================================================================== */
const init = function () {
  // 1. Restore session or prepare login screen
  model.initSession();

  // 2. Render initial view state
  renderApp();

  // 3. Bind Publisher-Subscriber Handlers across all Views
  authView.addHandlerAuth({
    onSwitchMode: controlAuthSwitchMode,
    onLogin: controlLogin,
    onRegister: controlRegister,
  });

  navigationView.addHandlerNavigate(controlNavigate);
  navigationView.addHandlerLogout(controlLogout);

  dashboardView.addHandlerQuickNav(controlNavigate);

  allowanceView.addHandlerActions({
    onAdd: controlAddAllowance,
    onEdit: controlEditTransaction,
    onDelete: controlDeleteTransaction,
  });

  expenseView.addHandlerActions({
    onAdd: controlAddExpense,
    onEdit: controlEditTransaction,
    onDelete: controlDeleteTransaction,
  });

  transactionView.addHandlerActions({
    onEdit: controlEditTransaction,
    onDelete: controlDeleteTransaction,
    onFilter: controlFilterTransactions,
    onSearch: controlSearchTransactions,
    onExportCSV: controlExportCSV,
  });

  profileView.addHandlerProfile({
    onUpdateProfile: controlUpdateProfile,
    onExportCSV: controlExportCSV,
    onClearData: controlClearAllData,
    onLogout: controlLogout,
  });

  setupEditModalListeners();
  setupConfirmModalListeners();
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();

  </script>
</body>
</html>
